<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webdev Agent Online</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --text: #1f2937;
      --accent: #0f766e;
      --accent-hover: #115e59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg) 65%);
      color: var(--text);
    }
    .card {
      width: min(92vw, 560px);
      padding: 2rem;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.8rem, 2.6vw, 2.5rem);
    }
    p {
      margin: 0 0 1.5rem;
      line-height: 1.6;
      color: #4b5563;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 0.75rem 1.2rem;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Webdev Agent Online</h1>
    <p>This page confirms the full GitHub to Vercel pipeline is up and running.</p>
    <button type="button">Pipeline Verified</button>
  </main>
</body>
</html>
