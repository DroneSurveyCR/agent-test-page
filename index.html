<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webdev Agent Online</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #18202a;
      --muted: #556170;
      --btn: #0f766e;
      --btn-hover: #115e59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, #e6f4ff, transparent 60%), var(--bg);
      color: var(--text);
    }
    .card {
      width: min(680px, 92vw);
      background: var(--card);
      border: 1px solid #e7ebf0;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(10, 20, 40, 0.06);
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 3vw, 2.2rem); }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: var(--btn);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform .08s ease, background .15s ease;
    }
    button:hover { background: var(--btn-hover); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Webdev Agent Online</h1>
    <p>This static test page confirms the GitHub and Vercel deployment pipeline is working end to end.</p>
    <button type="button">Pipeline Check</button>
  </main>
</body>
</html>
