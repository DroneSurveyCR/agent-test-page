<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webdev Agent Online</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --btn: #0ea5e9;
      --btn-hover: #0284c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #e0f2fe 0%, var(--bg) 45%, #dbeafe 100%);
      color: var(--text);
    }
    .card {
      width: min(92vw, 560px);
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 14px 38px rgba(2, 6, 23, 0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      line-height: 1.15;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    button {
      border: 0;
      background: var(--btn);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease;
    }
    button:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Webdev Agent Online</h1>
    <p>This test page confirms the full GitHub to Vercel pipeline is active.</p>
    <button type="button">Pipeline Check</button>
  </main>
</body>
</html>
