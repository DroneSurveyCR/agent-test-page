<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webdev Agent Online</title>
  <style>
    :root { --bg:#f4f7fb; --card:#ffffff; --text:#0f172a; --muted:#475569; --btn:#2563eb; --btnh:#1d4ed8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, var(--bg), #e2e8f0);
      color: var(--text);
    }
    .card {
      background: var(--card);
      padding: 2rem;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      max-width: 620px;
      width: calc(100% - 2rem);
      text-align: center;
    }
    h1 { margin: 0 0 0.75rem; font-size: clamp(1.8rem, 4vw, 2.4rem); }
    p { margin: 0 0 1.4rem; color: var(--muted); line-height: 1.5; }
    button {
      border: 0;
      background: var(--btn);
      color: #fff;
      padding: 0.75rem 1.1rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, background .2s ease;
    }
    button:hover { background: var(--btnh); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Webdev Agent Online</h1>
    <p>This is a minimal static test page deployed to verify the full GitHub and Vercel pipeline.</p>
    <button type="button">Pipeline Check</button>
  </main>
</body>
</html>
